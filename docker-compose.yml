version: '3.9'

services:
  app:
    build: .
    container_name: invoice-intelligence-hub
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_REQUIRED: 'true'
      JWT_SECRET: change-me-in-production
      ERP_MODE: demo
      STORAGE_PATH: /app/uploads
      DB_PATH: /app/data/app.db
    volumes:
      - ./uploads:/app/uploads
      - ./backend/data:/app/backend/data
