<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyMe Invoice Intelligence</title>
    <meta name="description" content="Invoice matching, exception review, and ERP posting workspace" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/enhancements.css" />
    <link rel="stylesheet" href="/css/review-panel.css" />
    <link rel="stylesheet" href="/css/integrations.css" />
    <link rel="stylesheet" href="/css/premium.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="topbar-brand">
          <div class="brand-mark">E</div>
          <div class="brand-copy">
            <div class="brand-title">EasyMe</div>
            <div class="brand-subtitle">Accounts payable</div>
          </div>
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar" title="Collapse sidebar">
            <span class="toggle-icon">‹</span>
          </button>
        </div>

        <nav class="nav" aria-label="Sidebar navigation">
          <button class="nav-item" data-view="exceptions">Exceptions</button>
          <button class="nav-item" data-view="invoices">Invoices</button>
          <button class="nav-item" data-view="upload">Upload</button>
          <button class="nav-item" data-view="dashboard">Dashboard</button>
          <button class="nav-item" data-view="workflow">Workflow</button>
          <button class="nav-item" data-view="exports">Exports</button>
        </nav>

        <div class="sidebar-footer">
          <div class="mini-badge">Live ops</div>
          <div class="mini-metric">
            <span>Needs decision</span>
            <strong id="queueCount">0</strong>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="main-header">
          <button class="menu-toggle-btn" id="menuToggle" aria-label="Toggle sidebar menu" title="Menu">☰</button>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="globalSearch" type="search" placeholder="Search vendor, invoice, PO, or status" aria-label="Search invoices" />
          </div>

          <div class="header-actions">
            <button class="icon-btn" id="noticeToggle" aria-label="Audit notifications" type="button">Alerts</button>
            <button class="icon-btn" id="reportsButton" aria-label="Open exports" type="button">Reports</button>
            <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
            <div class="profile-pill" id="profilePill" tabindex="0" role="button" aria-haspopup="menu" aria-expanded="false">
              <div class="profile-avatar" id="profileAvatar">—</div>
              <div class="profile-meta">
                <span class="profile-name" id="profileName">Sign in</span>
                <span class="profile-role" id="profileRole">Restricted</span>
              </div>
              <div id="accountMenu" class="account-menu" role="menu"></div>
            </div>
            <div id="noticePanel" class="notice-panel" hidden></div>
          </div>
        </header>

        <div id="appView" class="app-view"></div>
        <div id="toastContainer" class="toast-container"></div>
        <div id="loginGate" class="login-gate" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
          <form id="loginForm" class="login-card">
            <div class="login-kicker">EasyMe</div>
            <h1 id="loginTitle">Sign in to review and post</h1>
            <p>Exception review, matching evidence, and ERP posting in one workspace.</p>
            <div class="role-chips" aria-label="Demo roles">
              <button type="button" class="role-chip" data-email="finance@easyme.local" aria-pressed="true">Finance · post</button>
              <button type="button" class="role-chip" data-email="manager@easyme.local" aria-pressed="false">Manager · review</button>
              <button type="button" class="role-chip" data-email="clerk@easyme.local" aria-pressed="false">Clerk · query</button>
            </div>
            <label>Email<input id="loginEmail" name="email" type="email" value="finance@easyme.local" autocomplete="username" required /></label>
            <label class="password-row">Password
              <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
              <button type="button" id="togglePassword">Show</button>
            </label>
            <button class="primary-button" type="submit">Continue</button>
            <p class="login-hint">Demo password is demo123. Finance can post; clerk cannot.</p>
            <div id="loginError" class="upload-status error" hidden></div>
          </form>
        </div>
      </main>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
